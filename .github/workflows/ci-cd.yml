name: CI-CD Calculator

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    name: Compilation, tests et Docker
    runs-on: ubuntu-latest

    steps:
      - name: Récupération du code source
        uses: actions/checkout@v7

      - name: Installation de Java 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Compilation et tests Maven
        run: mvn -B -ntp clean verify

      - name: Vérification du JAR
        run: |
          ls -lh target/
          test -f target/Calculator-0.0.1-SNAPSHOT.jar

      - name: Sauvegarde du JAR
        uses: actions/upload-artifact@v4
        with:
          name: calculator-jar
          path: target/Calculator-0.0.1-SNAPSHOT.jar
          if-no-files-found: error

      - name: Construction de l'image Docker
        run: docker build -t calculator:1.0 .

      - name: Démarrage du conteneur
        run: |
          docker run -d \
            --name calculator-ci \
            -p 8089:8089 \
            calculator:1.0

      - name: Vérification du service SOAP
        run: |
          for i in $(seq 1 30); do
            if curl -fsS \
              "http://localhost:8089/?wsdl" \
              -o /tmp/calculator.wsdl &&
              grep -qi "definitions" /tmp/calculator.wsdl; then
              echo "Service SOAP accessible"
              exit 0
            fi
            sleep 2
          done

          echo "Service SOAP inaccessible"
          docker logs calculator-ci
          exit 1

      - name: Arrêt du conteneur
        if: always()
        run: docker rm -f calculator-ci || true
